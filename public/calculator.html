<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة أسعار بوابات الرولينج شتر</title>
    <meta name="description" content="احسب السعر التقديري لبوابات الرولينج شتر — اختر المقاس ونوع الشرائح والإكسسوارات والولاية واطلب عرض سعر.">
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Same visual identity as the company site's calculators (radma.co/price-calc) */
        :root {
            --radma-primary: #1e40af;
            --radma-primary-dark: #1e3a8a;
            --radma-accent: #2563eb;
            --radma-success: #16a34a;
            --radma-whatsapp: #25D366;
            --radma-whatsapp-dark: #128C7E;
            --radma-danger: #dc2626;
            --radma-bg: #f1f5f9;
            --radma-card-bg: #ffffff;
            --radma-border: #e2e8f0;
            --radma-text: #1e293b;
            --radma-text-muted: #64748b;
            --radma-radius: 16px;
            --radma-radius-sm: 10px;
            --radma-shadow: 0 6px 20px -6px rgba(30, 58, 138, 0.12);
        }
        * { font-family: 'Tajawal', sans-serif; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0; min-height: 100vh; display: flex; flex-direction: column; color: var(--radma-text);
            background: radial-gradient(800px 300px at 90% -5%, rgba(37, 99, 235, 0.06), transparent 60%), var(--radma-bg);
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: #1d4ed8; color: #fff; }
        [hidden] { display: none !important; }

        /* ---------- Header ---------- */
        .site-header {
            position: sticky; top: 0; z-index: 50; padding: 12px 16px;
            background: rgba(255, 255, 255, 0.9); border-bottom: 1px solid var(--radma-border);
            -webkit-backdrop-filter: blur(12px) saturate(160%); backdrop-filter: blur(12px) saturate(160%);
            box-shadow: 0 1px 0 rgba(15, 23, 42, 0.05);
        }
        .header-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--radma-text); min-height: 48px; }
        .brand img { height: 48px; width: auto; }
        .brand-name { font-size: 1.05rem; font-weight: 700; line-height: 1.3; }
        .site-link { color: var(--radma-accent); text-decoration: none; font-weight: 700; font-size: 0.9rem; padding: 10px 8px; }
        .site-link:hover { text-decoration: underline; }

        /* ---------- Content ---------- */
        .site-main { flex: 1; width: 100%; max-width: 960px; margin: 0 auto; padding: 20px 16px 40px; }
        .calc-container {
            max-width: 800px; margin: 0 auto; background: var(--radma-card-bg); padding: 30px;
            border-radius: var(--radma-radius); box-shadow: var(--radma-shadow); border: 1px solid rgba(15, 23, 42, 0.05);
        }
        @media (max-width: 480px) { .calc-container { padding: 20px 16px; } }
        .calc-header { text-align: center; margin-bottom: 30px; }
        .calc-header img { max-width: 150px; height: auto; margin-bottom: 15px; }
        .calc-header h1 { font-size: 1.5rem; margin: 0 0 8px; color: var(--radma-primary); }
        .calc-header p { color: var(--radma-text-muted); margin: 0 0 8px; }
        .color-offer { color: var(--radma-danger); font-weight: bold; }

        .section {
            margin-bottom: 30px; padding: 20px; border: 1px solid var(--radma-border);
            border-radius: var(--radma-radius-sm); background: #fff; transition: box-shadow .25s ease;
        }
        .section:focus-within { box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08); }
        .section h2 { font-size: 1.15rem; margin: 0 0 15px; color: var(--radma-primary); }
        .icon { margin-left: 8px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: var(--radma-text); font-weight: 700; }
        input, select, textarea {
            width: 100%; padding: 12px; border: 1px solid #cfd8e0; border-radius: var(--radma-radius-sm);
            margin-bottom: 10px; font-size: 16px; background: #fff; color: var(--radma-text);
            transition: border-color .2s ease, box-shadow .2s ease;
        }
        input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: none; border-color: var(--radma-accent); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }
        select:disabled { background: #f8fafc; color: var(--radma-text-muted); }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
        @media (max-width: 480px) { .row-2 { grid-template-columns: 1fr; } }
        .description { color: #666; font-size: 14px; margin-top: -2px; margin-bottom: 12px; line-height: 1.7; }
        .dimension-note { font-size: 13px; color: var(--radma-text-muted); margin-top: -4px; margin-bottom: 10px; font-style: italic; }
        .color-dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 1px solid #cfd8e0; vertical-align: -2px; margin-left: 6px; }

        .acc-item { padding-bottom: 6px; margin-bottom: 12px; border-bottom: 1px dashed var(--radma-border); }
        .acc-item:last-child { border-bottom: none; margin-bottom: 0; }
        .acc-item .acc-price { float: left; color: var(--radma-success); font-weight: 700; font-size: 14px; }

        button {
            background: var(--radma-primary); color: white; border: none; padding: 14px 25px;
            border-radius: var(--radma-radius-sm); cursor: pointer; font-size: 16px; font-weight: 700;
            display: block; margin: 20px auto; min-height: 48px;
            box-shadow: 0 10px 24px -10px rgba(30, 64, 175, 0.5);
            transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
        }
        button:hover { background: var(--radma-primary-dark); transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        button:focus-visible { outline: 3px solid var(--radma-accent); outline-offset: 2px; }
        button:disabled { background: #90a0af; cursor: not-allowed; box-shadow: none; transform: none; }
        .whatsapp-btn {
            background: var(--radma-whatsapp); display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 10px 24px -10px rgba(18, 140, 126, 0.55);
        }
        .whatsapp-btn:hover { background: var(--radma-whatsapp-dark); }
        a.link-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px;
            padding: 14px 25px; border-radius: var(--radma-radius-sm); font-weight: 700; font-size: 16px;
            text-decoration: none; color: #fff; background: var(--radma-primary);
            box-shadow: 0 10px 24px -10px rgba(30, 64, 175, 0.5); transition: transform .2s ease, background .2s ease;
        }
        a.link-btn:hover { background: var(--radma-primary-dark); transform: translateY(-2px); }
        a.link-btn.whatsapp-btn { background: var(--radma-whatsapp); box-shadow: 0 10px 24px -10px rgba(18, 140, 126, 0.55); }
        a.link-btn.whatsapp-btn:hover { background: var(--radma-whatsapp-dark); }

        .result { text-align: center; font-size: 24px; color: var(--radma-success); font-weight: bold; margin: 20px 0 10px; }
        .breakdown {
            max-width: 560px; margin: 0 auto 10px; font-size: 14px; border: 1px solid var(--radma-border);
            border-radius: var(--radma-radius-sm); overflow: hidden;
        }
        .breakdown div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 14px; }
        .breakdown div:nth-child(even) { background: #f8fafc; }
        .breakdown div span:first-child { color: var(--radma-text-muted); }
        .breakdown .total-row { background: #eef4ff !important; font-weight: 700; }
        .breakdown .total-row span:first-child { color: var(--radma-primary); }
        .fees-note { text-align: center; color: var(--radma-text-muted); font-size: 13px; margin-bottom: 6px; }

        .notes { color: var(--radma-text-muted); font-size: 14px; margin-top: 20px; text-align: center; line-height: 1.8; }
        .submit-status { text-align: center; font-weight: 700; border-radius: var(--radma-radius-sm); margin: 15px auto; max-width: 600px; line-height: 1.8; }
        .submit-status:not(:empty) { padding: 14px 16px; }
        .status-pending { background: #eaf2fb; color: #1f5d8f; }
        .status-success { background: #e8f8ef; color: #1d7a43; }
        .status-error { background: #fdecea; color: #a93226; }
        .success-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .success-actions a, .success-actions button { margin: 0; }
        .quote-ref { direction: ltr; display: inline-block; font-size: 1.3em; }
        .other-link { text-align: center; font-size: 14px; }
        .other-link a { color: var(--radma-accent); font-weight: 700; text-decoration: none; }

        /* ---------- Footer ---------- */
        .site-footer { background: linear-gradient(135deg, #172554 0%, #1e3a8a 100%); color: #ecf0f1; margin-top: 40px; padding: 26px 16px; }
        .footer-inner {
            max-width: 960px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 30px;
            align-items: center; justify-content: center; text-align: center; line-height: 1.9;
        }
        .footer-brand { font-weight: 700; font-size: 1.05rem; width: 100%; }
        .site-footer a { color: #aed6f1; text-decoration: none; }
        .site-footer a:hover { text-decoration: underline; }
        .copyright { width: 100%; font-size: 0.85rem; color: #bdc3c7; margin-top: 6px; }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="calculator.html">
                <img src="images/logo.png" alt="الشعار" width="48" height="48">
                <span class="brand-name" data-bind="company_name"></span>
            </a>
            <a class="site-link" id="siteLink" target="_blank" rel="noopener" hidden></a>
        </div>
    </header>

    <main class="site-main">
        <div class="calc-container">
            <div class="calc-header">
                <img src="images/logo.png" alt="الشعار">
                <h1>حاسبة أسعار بوابات رولينج شتر</h1>
                <p data-bind="company_tagline"></p>
                <div class="color-offer" id="topNotice"></div>
            </div>

            <div id="calcForm">
                <div class="section">
                    <h2><i class="fas fa-user icon"></i> بيانات العميل</h2>
                    <div class="input-group">
                        <label for="clientName">اسم العميل:</label>
                        <input type="text" id="clientName" autocomplete="name">
                    </div>
                    <div class="input-group">
                        <label for="clientPhone">رقم الجوال:</label>
                        <input type="tel" id="clientPhone" autocomplete="tel" inputmode="tel" placeholder="مثال: 9XXXXXXX">
                    </div>
                    <div class="input-group">
                        <label for="governorate">المحافظة:</label>
                        <select id="governorate"></select>
                    </div>
                    <div class="input-group">
                        <label for="state">الولاية:</label>
                        <select id="state"></select>
                    </div>
                </div>

                <div class="section">
                    <h2><i class="fas fa-door-open icon"></i> بيانات البوابة</h2>
                    <div class="row-2">
                        <div class="input-group">
                            <label for="width">العرض (سم):</label>
                            <input type="number" id="width" min="50" max="1500" inputmode="numeric">
                        </div>
                        <div class="input-group">
                            <label for="height">الارتفاع (سم):</label>
                            <input type="number" id="height" min="50" max="1000" inputmode="numeric">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="count">عدد البوابات:</label>
                        <input type="number" id="count" min="1" max="50" value="1" inputmode="numeric">
                    </div>
                    <div class="input-group">
                        <label for="type">نوع البوابة:</label>
                        <select id="type"></select>
                    </div>
                    <div class="description" id="typeDescription"></div>
                    <div class="input-group" id="variantGroup" hidden>
                        <label for="variant">السماكة / الدرجة:</label>
                        <select id="variant"></select>
                    </div>
                    <div class="input-group" id="colorGroup" hidden>
                        <label for="color">اللون: <span class="color-dot" id="colorDot" hidden></span></label>
                        <select id="color"></select>
                    </div>
                </div>

                <div class="section" id="accSection">
                    <h2><i class="fas fa-cogs icon"></i> الإكسسوارات</h2>
                    <div id="accGroups"></div>
                </div>

                <div class="input-group">
                    <label for="notes">ملاحظات (اختياري):</label>
                    <textarea id="notes" rows="2"></textarea>
                </div>

                <button type="button" id="calcBtn" onclick="calculate()"><i class="fas fa-calculator icon"></i> احتساب السعر</button>
                <div id="resultBox" hidden>
                    <div class="result" id="result"></div>
                    <div class="breakdown" id="breakdown"></div>
                    <div class="fees-note" id="feesNote"></div>
                    <button type="button" class="whatsapp-btn" id="submitBtn" onclick="submitQuote()"><i class="fab fa-whatsapp"></i> إرسال طلب عرض السعر</button>
                </div>
            </div>

            <div id="submitStatus" class="submit-status" role="status" aria-live="polite"></div>

            <div id="successBox" hidden>
                <div class="success-actions">
                    <a class="link-btn" id="pdfLink" target="_blank" rel="noopener"><i class="fas fa-file-pdf"></i> تحميل عرض السعر PDF</a>
                    <a class="link-btn whatsapp-btn" id="waLink" target="_blank" rel="noopener" hidden><i class="fab fa-whatsapp"></i> تابع عبر واتساب</a>
                </div>
                <button type="button" onclick="location.reload()" style="background:#64748b"><i class="fas fa-redo icon"></i> حساب بوابة أخرى</button>
            </div>

            <div class="color-offer" id="bottomNotice" style="text-align:center"></div>
            <div class="notes" id="notesBox"></div>
            <div class="other-link"><a href="materials.html">شراء شرائح أو إكسسوارات بالكمية ←</a></div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <span class="footer-brand" data-bind="company_name"></span>
            <span id="footPhone" hidden>خدمة العملاء: <a dir="ltr"></a></span>
            <span id="footAddress" hidden>الموقع: <span></span></span>
            <span id="footSite" hidden>الموقع الإلكتروني: <a target="_blank" rel="noopener"></a></span>
            <span class="copyright">© <span id="year"></span> <span data-bind="company_name"></span> — جميع الحقوق محفوظة</span>
        </div>
    </footer>

    <script src="location.js"></script>
    <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const money = (n) => Number(n).toFixed(2);
    // Isolate each part so mixed Arabic/Latin labels ("العماني Napco" — "1.5 ملم") keep their order
    const parts = (...list) => list.filter(Boolean).map((p) => `<bdi>${esc(p)}</bdi>`).join(' — ');
    const NOTE_ICONS = ['fa-info-circle', 'fa-exclamation-triangle', 'fa-shield-alt', 'fa-check-circle'];

    let conf = null;
    let region = null;
    let lastPrice = null;

    const currentType = () => conf.shutter_types.find((t) => t.id === Number($('type').value));
    const size = () => ({
        width: parseFloat($('width').value), height: parseFloat($('height').value),
        count: Math.max(1, parseInt($('count').value, 10) || 1)
    });
    const sizeValid = () => { const s = size(); return s.width >= 50 && s.width <= 1500 && s.height >= 50 && s.height <= 1000; };

    function setStatus(kind, message) {
        const el = $('submitStatus');
        el.className = 'submit-status' + (kind ? ' status-' + kind : '');
        el.innerHTML = message || '';
    }

    async function load() {
        try {
            const res = await fetch('/api/public/configurator');
            if (!res.ok) throw new Error();
            conf = await res.json();
        } catch {
            $('calcForm').innerHTML = '<div class="submit-status status-error">تعذر تحميل الحاسبة. يرجى المحاولة لاحقاً.</div>';
            return;
        }
        renderCompany();
        renderAccessories();
        setupLocationPicker(conf.locations, $('governorate'), $('state'), (w) => { region = w; invalidate(); });

        $('type').innerHTML = '<option value="">اختر النوع</option>' +
            conf.shutter_types.map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
        $('type').addEventListener('change', () => { renderTypeDetails(); invalidate(); });
        $('variant').addEventListener('change', () => { renderVariantDetails(); invalidate(); });
        $('color').addEventListener('change', () => { renderColorDot(); invalidate(); });
        for (const id of ['width', 'height', 'count']) $(id).addEventListener('input', invalidate);
    }

    function renderCompany() {
        document.querySelectorAll('[data-bind]').forEach((el) => { el.textContent = conf[el.dataset.bind] || ''; });
        document.title = 'حاسبة أسعار بوابات الرولينج شتر | ' + conf.company_name;
        const notice = conf.calculator_notice || '';
        $('topNotice').textContent = notice ? '🏷️' + notice + '🏷️' : '';
        $('bottomNotice').textContent = notice;
        $('notesBox').innerHTML = String(conf.calculator_notes || '').split('\n').filter((l) => l.trim())
            .map((l, i) => `<i class="fas ${NOTE_ICONS[i % NOTE_ICONS.length]}"></i> ${esc(l.trim())}`).join('<br>');
        const site = (conf.company_website || '').trim();
        if (site) {
            const href = /^https?:\/\//.test(site) ? site : 'https://' + site;
            $('siteLink').href = href; $('siteLink').textContent = site.replace(/^https?:\/\//, ''); $('siteLink').hidden = false;
            const a = $('footSite').querySelector('a'); a.href = href; a.textContent = $('siteLink').textContent; $('footSite').hidden = false;
        }
        if (conf.company_phone) {
            const a = $('footPhone').querySelector('a');
            a.href = 'tel:' + conf.company_phone.replace(/[^\d+]/g, '');
            a.textContent = conf.company_phone; $('footPhone').hidden = false;
        }
        if (conf.company_address) { $('footAddress').querySelector('span').textContent = conf.company_address; $('footAddress').hidden = false; }
        $('year').textContent = new Date().getFullYear();
    }

    const currentVariant = () => {
        const t = currentType();
        if (!t) return null;
        return t.variants.length === 1 ? t.variants[0] : t.variants.find((v) => v.id === Number($('variant').value)) || null;
    };

    function renderTypeDetails() {
        const t = currentType();
        $('typeDescription').textContent = t ? t.description || '' : '';
        $('variantGroup').hidden = !t || t.variants.length < 2;
        $('variant').innerHTML = t ? (t.variants.length > 1 ? '<option value="">اختر</option>' : '') +
            t.variants.map((v) => `<option value="${v.id}">${esc(v.label)}</option>`).join('') : '';
        renderVariantDetails();
    }

    /* Colors depend on the chosen thickness/grade (type → thickness → color) */
    function renderVariantDetails() {
        const t = currentType();
        const v = currentVariant();
        const desc = v && v.description ? v.description : (t ? t.description || '' : '');
        $('typeDescription').textContent = desc;
        const colors = v ? v.colors : [];
        $('colorGroup').hidden = !colors.length;
        $('color').innerHTML = colors.length ? '<option value="">اختر اللون</option>' +
            colors.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('') : '';
        renderColorDot();
    }

    function renderColorDot() {
        const v = currentVariant();
        const c = v && v.colors.find((x) => x.id === Number($('color').value));
        $('colorDot').hidden = !c;
        if (c) $('colorDot').style.background = c.hex || '#ccc';
    }

    function renderAccessories() {
        $('accSection').hidden = !conf.accessory_groups.length;
        $('accGroups').innerHTML = conf.accessory_groups.map((g) => `
            <div class="acc-item">
                <div class="input-group" style="margin-bottom:0">
                    <label for="acc${g.id}">${esc(g.name)}: <span class="acc-price" id="accPrice${g.id}"></span></label>
                    <select id="acc${g.id}" data-group="${g.id}">
                        <option value="">اختر الفئة</option>
                        ${g.options.map((o) => `<option value="${o.id}">${esc(o.label)}</option>`).join('')}
                        ${g.allow_none ? `<option value="none">${esc(g.none_label || 'بدون')}</option>` : ''}
                    </select>
                </div>
                <div class="description" id="accDesc${g.id}">${esc(g.description || '')}</div>
            </div>`).join('');
        conf.accessory_groups.forEach((g) => {
            $('acc' + g.id).addEventListener('change', () => {
                const o = g.options.find((x) => x.id === Number($('acc' + g.id).value));
                $('accDesc' + g.id).textContent = o ? (o.details || g.description || '') : (g.description || '');
                invalidate();
            });
        });
    }

    /* Any change clears the previous result, so a stale price is never shown or sent */
    function invalidate() {
        lastPrice = null;
        $('resultBox').hidden = true;
        document.querySelectorAll('.acc-price').forEach((el) => { el.textContent = ''; });
        if ($('submitStatus').classList.contains('status-error')) setStatus('', '');
    }

    function missing() {
        const t = currentType();
        if (!region) return 'يرجى اختيار المحافظة والولاية.';
        if (!sizeValid()) return 'يرجى إدخال العرض (50–1500 سم) والارتفاع (50–1000 سم).';
        if (!t) return 'يرجى اختيار نوع البوابة.';
        const v = currentVariant();
        if (!v) return 'يرجى اختيار السماكة / الدرجة.';
        if (v.colors.length && !$('color').value) return 'يرجى اختيار اللون.';
        const g = conf.accessory_groups.find((x) => !$('acc' + x.id).value);
        if (g) return 'يرجى اختيار فئة ' + g.name + '.';
        return null;
    }

    function payload() {
        const s = size();
        const t = currentType();
        return {
            width_cm: s.width, height_cm: s.height, count: s.count,
            shutter_type_id: t ? t.id : null,
            variant_id: currentVariant() ? currentVariant().id : null,
            color_id: Number($('color').value) || null,
            option_ids: conf.accessory_groups.map((g) => Number($('acc' + g.id).value)).filter(Boolean),
            region_id: region ? region.id : null
        };
    }

    async function calculate() {
        const problem = missing();
        if (problem) { setStatus('error', '⚠️ ' + esc(problem)); return; }
        setStatus('', '');
        const btn = $('calcBtn');
        btn.disabled = true;
        try {
            const res = await fetch('/api/public/door-price', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload())
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'تعذر حساب السعر');
            lastPrice = data;
            showPrice();
        } catch (err) {
            setStatus('error', esc(err.message));
        } finally {
            btn.disabled = false;
        }
    }

    function showPrice() {
        $('result').innerHTML = `السعر الإجمالي: <span style="font-size:1.2em">${money(lastPrice.total)} ريال عماني</span>`;
        $('breakdown').innerHTML = lastPrice.items.map((i) =>
            `<div><span>${parts(i.name, i.type)}</span><span>${money(i.line_total)}</span></div>`).join('') +
            `<div><span>المجموع</span><span>${money(lastPrice.subtotal)}</span></div>` +
            `<div><span>ضريبة القيمة المضافة ${lastPrice.vat_percent}%</span><span>${money(lastPrice.vat)}</span></div>` +
            `<div class="total-row"><span>الإجمالي (ر.ع)</span><span>${money(lastPrice.total)}</span></div>`;
        $('feesNote').textContent = lastPrice.delivery_installation;
        for (const g of conf.accessory_groups) {
            const o = g.options.find((x) => x.id === Number($('acc' + g.id).value));
            const line = o && lastPrice.items.find((i) => i.name === g.name && i.type === o.label);
            $('accPrice' + g.id).textContent = line ? money(line.line_total) + ' ر.ع' : '';
        }
        $('resultBox').hidden = false;
        $('result').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    async function submitQuote() {
        const name = $('clientName').value.trim();
        const phone = $('clientPhone').value.trim();
        if (!name) return setStatus('error', 'يرجى إدخال اسم العميل قبل طلب عرض السعر.');
        if (!phone) return setStatus('error', 'يرجى إدخال رقم الجوال (مثال: 9XXXXXXX).');
        if (!lastPrice) return setStatus('error', 'يرجى احتساب السعر قبل الإرسال.');
        const btn = $('submitBtn');
        btn.disabled = true;
        setStatus('pending', 'جاري إرسال الطلب...');
        try {
            const res = await fetch('/api/public/door-quotes', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...payload(), customer_name: name, customer_phone: phone, notes: $('notes').value })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'تعذر إرسال الطلب');
            setStatus('success', `✅ تم استلام طلبك بنجاح — رقم عرض السعر: <span class="quote-ref">${esc(data.ref)}</span><br>
                الإجمالي: ${money(data.total)} ريال عماني — سيتواصل معك فريقنا قريباً.`);
            $('pdfLink').href = data.pdf_url;
            if (data.whatsapp_link) { $('waLink').href = data.whatsapp_link; $('waLink').hidden = false; }
            $('calcForm').hidden = true;
            $('successBox').hidden = false;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (err) {
            setStatus('error', esc(err.message));
        } finally {
            btn.disabled = false;
        }
    }

    load();
    </script>
</body>
</html>
